[audio]
backend = sdl2

[config]
UseReios = yes
aica.AutoLatency = no
aica.BufferSize = 5468
aica.DSPEnabled = no
pvr.AutoSkipFrame = 2
pvr.MaxThreads = 3
pvr.rend = 0
rend.AnisotropicFiltering = 1
rend.DelayFrameSwapping = yes
rend.DupeFrames = no
rend.PerStripSorting = yes
rend.RenderToTextureBuffer = no
rend.Resolution = 480
rend.Rotate90 = yes
rend.ShowFPS = no
rend.ThreadedRendering = yes
rend.vsync = yes
ta.skip = 0

[input]
device1 = 0
device1.1 = 1
device1.2 = 1
device2 = 10
device2.1 = 10
device2.2 = 10
device3 = 10
device3.1 = 10
device3.2 = 10
device4 = 10
device4.1 = 10
device4.2 = 10
maple_sdl_joystick_0 = 0
maple_sdl_keyboard = 0
maple_sdl_mouse = 0

[window]
fullscreen = yes
height = 480
width = 640
